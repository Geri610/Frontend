<div class="ui inverted menu">
  <div class="ui container">

    <a class="header item" routerLink="/">
      <i class="truck icon"></i>
      DeliFHery
    </a>

    <!-- Hauptmenü -->
    <div class="right menu">
      <!-- Wir prüfen, ob das ID-Observable ungleich null ist -->
      @if ((auth.currentCustomerId$ | async) !== null) {
        <a class="item" routerLink="/items" routerLinkActive="active">
          <i class="address book icon"></i> Items
        </a>
        <a class="item" routerLink="/shipment" routerLinkActive="active">
          <i class="shipping fast icon"></i> Shipment
        </a>
        <a class="item" routerLink="/price" routerLinkActive="active">
          <i class="dollar icon"></i> Price
        </a>
        <a class="item" routerLink="/tracking" routerLinkActive="active">
          <i class="coffee icon"></i> Tracking
        </a>
        <a class="item" routerLink="/notification" routerLinkActive="active">
          <i class="bell icon"></i> Notification
        </a>
        <a class="item" routerLink="/Statistics" routerLinkActive="active">
          <i class="book icon"></i> Statistics
        </a>
        <a class="item" style="cursor: pointer;" (click)="auth.logout()">
          <i class="lock open icon"></i> Logout
        </a>
      } @else {    
        <!-- Wenn keine ID vorhanden ist, leiten wir zur Anmeldeseite weiter -->
        <a class="item" routerLink="/anmeldung" routerLinkActive="active">
          <i class="lock icon"></i> Login
        </a>
      }
    </div>
  </div>
</div>

<!-- Router Outlet -->
<div class="ui main container" style="margin-top: 2rem;">
  <router-outlet></router-outlet>
</div>
