<div class="login-container">
  <h2>Anmeldung</h2>

  <!-- Fehlermeldung anzeigen mit modernem Control Flow -->
  @if (errorMessage) {
    <div class="alert alert-danger">
      {{ errorMessage }}
    </div>
  }

  <form (ngSubmit)="onLogin()">
    <div class="form-group">
      <label for="email">E-Mail (Benutzer):</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        [(ngModel)]="email" 
        required
        class="form-control">
    </div>

    <div class="form-group">
      <label for="password">Passwort:</label>
      <input 
        type="password" 
        id="password" 
        name="password" 
        [(ngModel)]="password" 
        required
        class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">Anmelden</button>
  </form>
</div>
