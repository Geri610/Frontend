<div class="ui container" style="margin-top: 2rem; max-width: 800px;">
  <h3>Tracking-Id: {{ trackingId }}</h3>
    <h3>Versand-Etikett:</h3>

  @if(barcodeUrl){
  <div>
    <img [src]="barcodeUrl" alt="Shipment Barcode" style='border:1px solid #000000'/>
  </div>

  <ng-template #loading>
    <p>Barcode wird geladen...</p>
  </ng-template>
}
</div>
